<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#1c8a55"/>
      <stop offset="1" stop-color="#062618"/>
    </radialGradient>
    <radialGradient id="gold" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffe28a"/>
      <stop offset="1" stop-color="#d9a21b"/>
    </radialGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd84d"/>
      <stop offset="1" stop-color="#c98a00"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="700" rx="800" ry="200" fill="#000" opacity="0.22"/>

  <!-- קלפים ברקע -->
  <g filter="url(#sh)">
    <g transform="translate(925 175) rotate(-10) scale(0.85)">
      <rect width="170" height="240" rx="16" fill="#fff"/>
      <text x="22" y="58" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#141414">A</text>
      <g transform="translate(85 150) scale(0.32) translate(-256 -261)"><path d="M256 150 C 296 196, 348 222, 348 272 C 348 312, 306 330, 274 310 C 278 340, 288 360, 304 372 L 208 372 C 224 360, 234 340, 238 310 C 206 330, 164 312, 164 272 C 164 222, 216 196, 256 150 Z" fill="#141414"/></g>
    </g>
    <g transform="translate(1025 195) rotate(9) scale(0.85)">
      <rect width="170" height="240" rx="16" fill="#fff"/>
      <text x="22" y="58" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#d62839">K</text>
      <text x="85" y="160" font-family="Segoe UI Symbol, Arial" font-size="90" text-anchor="middle" fill="#d62839">♥</text>
    </g>
  </g>

  <!-- ז׳טון עם כתר -->
  <g transform="translate(40 135) scale(0.9)" filter="url(#sh)">
    <circle cx="200" cy="200" r="190" fill="url(#gold)"/>
    <circle cx="200" cy="200" r="174" fill="none" stroke="#fff" stroke-width="28" stroke-dasharray="45.5 45.5"/>
    <circle cx="200" cy="200" r="134" fill="#fff8e6"/>
    <path d="M136 150 L130 98 L170 126 L200 84 L230 126 L270 98 L264 150 Z" fill="url(#crown)" stroke="#8a5d00" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="130" cy="96" r="9" fill="#e63946"/>
    <circle cx="200" cy="82" r="10" fill="#e63946"/>
    <circle cx="270" cy="96" r="9" fill="#e63946"/>
    <g transform="translate(200 160) scale(0.7) translate(-256 -150)">
      <path d="M256 150 C 296 196, 348 222, 348 272 C 348 312, 306 330, 274 310 C 278 340, 288 360, 304 372 L 208 372 C 224 360, 234 340, 238 310 C 206 330, 164 312, 164 272 C 164 222, 216 196, 256 150 Z" fill="#141414"/>
    </g>
  </g>

  <text x="660" y="285" font-family="Segoe UI, Arial" font-size="96" font-weight="800" fill="#f5c542" text-anchor="middle" filter="url(#sh)">King Jack</text>
  <text x="660" y="365" font-family="Arial" font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle" direction="rtl">פוקר ובלאק ג׳ק עם החבר׳ה</text>
  <text x="660" y="425" font-family="Segoe UI, Arial" font-size="30" fill="#cfe9dc" text-anchor="middle">Texas Hold'em · Blackjack · Settle-up</text>
